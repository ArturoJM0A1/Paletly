<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10172b" />
  <title>Encuesta rápida | Web Components + Lit</title>

  <!--
    =========================================================
    ESTILOS GENERALES DE LA PÁGINA
    =========================================================
    Solo maquetan el fondo, el encabezado y el panel externo.
    Los estilos del componente van encapsulados en su Shadow DOM.
  -->
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #10172b;
      color: #f7f8ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(71, 105, 255, 0.30), transparent 38%),
        radial-gradient(ellipse at 88% 78%, rgba(153, 76, 255, 0.24), transparent 34%),
        linear-gradient(135deg, #10172b 0%, #17213d 52%, #11182d 100%);
    }

    /* Luces decorativas fijas del fondo. */
    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      content: "";
      filter: blur(90px);
      pointer-events: none;
    }
    body::before {
      top: 8%;
      left: -120px;
      background: rgba(72, 118, 255, 0.22);
    }
    body::after {
      right: -120px;
      bottom: 4%;
      background: rgba(174, 91, 255, 0.20);
    }

    .pagina {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      align-content: center;
      justify-items: center;
      gap: 28px;
      padding: 56px 20px;
    }

    .encabezado {
      width: min(100%, 760px);
      text-align: center;
    }

    .encabezado__sobrelinea {
      margin: 0 0 12px;
      color: #aebdff;
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.20em;
      text-transform: uppercase;
    }

    .encabezado h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 760;
      letter-spacing: -0.055em;
      line-height: 1.08;
    }

    .encabezado__descripcion {
      max-width: 590px;
      margin: 16px auto 0;
      color: #c1c9df;
      font-size: 1rem;
      line-height: 1.7;
    }

    /* Panel externo que recibe el evento "encuesta-completada". */
    .panel-evento {
      width: min(100%, 560px);
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .panel-evento__titulo {
      margin: 0 0 6px;
      color: #aebdff;
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .panel-evento p:last-child {
      margin: 0;
      color: #e1e6f8;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .pie {
      color: #909ab7;
      font-size: 0.78rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      .pagina { gap: 22px; padding: 40px 16px; }
      .encabezado__descripcion { font-size: 0.92rem; }
    }
  </style>

  <!--
    Lit se importa como módulo ESM desde CDN.
    Babel Standalone transpila los decoradores (versión estándar 2023-05)
    para que todo funcione desde este único index.html sin build local.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script>
    // Registramos el preset con el plugin de decoradores estándar (2023-05),
    // que es el que admite Lit 3 junto con la palabra clave "accessor".
    Babel.registerPreset("lit-decoradores", {
      plugins: [
        [Babel.availablePlugins["proposal-decorators"], { version: "2023-05" }]
      ]
    });
  </script>

  <script type="text/babel" data-type="module" data-presets="lit-decoradores">
    // =========================================================
    // IMPORTACIONES DESDE LIT 3 (CDN, como módulo)
    // =========================================================
    import { LitElement, html, css } from "https://cdn.jsdelivr.net/npm/lit@3/+esm";
    import { state } from "https://cdn.jsdelivr.net/npm/lit@3/decorators.js/+esm";

    /**
     * <encuesta-rapida>
     * -----------------------------------------------------------------
     * Componente con un único botón que lanza tres preguntas
     * (nombre completo, comida favorita y mascota) usando prompt().
     *
     * Cada respuesta queda guardada como estado reactivo (@state),
     * así al cambiar se vuelve a renderizar la vista.
     *
     * Al terminar las tres preguntas se emite un CustomEvent
     * "encuesta-completada" (composed: true) que atraviesa el
     * Shadow DOM y puede escucharse desde document.
     */
    class EncuestaRapida extends LitElement {

      // -----------------------------------------------------
      // ESTADO REACTIVO INTERNO (dispara re-render al cambiar)
      // -----------------------------------------------------
      @state() accessor nombreCompleto = "";
      @state() accessor comidaFavorita = "";
      @state() accessor mascota = "";
      @state() accessor completada = false;
      @state() accessor mensaje = "Pulsa el botón para responder tres preguntas.";

      // -----------------------------------------------------
      // ESTILOS ENCAPSULADOS (solo afectan al Shadow DOM)
      // -----------------------------------------------------
      static styles = css`
        :host {
          display: block;
          width: min(100%, 560px);
          color: #f7f8ff;
        }

        * { box-sizing: border-box; }

        .tarjeta {
          position: relative;
          overflow: hidden;
          padding: clamp(24px, 5vw, 38px);
          border: 1px solid rgba(255, 255, 255, 0.23);
          border-radius: 28px;
          background: linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.17),
            rgba(255, 255, 255, 0.07)
          );
          box-shadow:
            0 24px 70px rgba(0, 0, 0, 0.30),
            inset 0 1px 0 rgba(255, 255, 255, 0.16);
          backdrop-filter: blur(24px);
          -webkit-backdrop-filter: blur(24px);
        }

        .marca {
          display: inline-flex;
          align-items: center;
          min-height: 28px;
          padding: 7px 11px;
          border: 1px solid rgba(173, 190, 255, 0.24);
          border-radius: 999px;
          background: rgba(111, 139, 255, 0.13);
          color: #cbd5ff;
          font-size: 0.68rem;
          font-weight: 760;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        }

        h2 {
          margin: 22px 0 0;
          font-size: clamp(1.7rem, 5vw, 2.3rem);
          font-weight: 760;
          letter-spacing: -0.05em;
          line-height: 1.15;
        }

        .instruccion {
          margin: 12px 0 0;
          color: #c8d0e5;
          font-size: 0.95rem;
          line-height: 1.6;
        }

        /* Mensaje de estado anunciado por lectores de pantalla */
        .mensaje {
          min-height: 22px;
          margin: 18px 0 0;
          color: #aebdff;
          font-size: 0.88rem;
          line-height: 1.5;
        }

        /* Lista de respuestas */
        .resultados {
          display: grid;
          gap: 12px;
          margin: 22px 0 0;
        }

        .respuesta {
          display: grid;
          gap: 4px;
          padding: 14px 16px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 14px;
          background: rgba(255, 255, 255, 0.05);
        }

        .respuesta__etiqueta {
          color: #aab5d0;
          font-size: 0.72rem;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        .respuesta__valor {
          color: #ffffff;
          font-size: 1rem;
          font-weight: 650;
          word-break: break-word;
        }

        /* Botón principal (único botón de la tarjeta) */
        button {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          min-height: 48px;
          margin-top: 26px;
          padding: 0 20px;
          border: 0;
          border-radius: 13px;
          background: linear-gradient(110deg, #a9baff, #c5a7ff);
          box-shadow: 0 8px 24px rgba(116, 125, 255, 0.25);
          color: #17203b;
          cursor: pointer;
          font: inherit;
          font-size: 0.92rem;
          font-weight: 760;
          transition: transform 160ms ease, filter 160ms ease;
        }

        button:hover {
          filter: brightness(1.08);
          transform: translateY(-2px);
        }

        button:active { transform: translateY(0); }

        button:focus-visible {
          outline: 3px solid #ffffff;
          outline-offset: 3px;
        }
      `;

      // -----------------------------------------------------
      // CICLO DE VIDA
      // -----------------------------------------------------

      // Se ejecuta cuando el componente se conecta al DOM.
      connectedCallback() {
        super.connectedCallback();
        console.info("[encuesta-rapida] connectedCallback(): componente conectado al DOM.");
      }

      // Se ejecuta tras cada actualización del componente.
      updated(propiedadesAnteriores) {
        const modificadas = [...propiedadesAnteriores.keys()];
        if (modificadas.length > 0) {
          console.info("[encuesta-rapida] updated():", modificadas);
        }
      }

      // -----------------------------------------------------
      // LÓGICA DE LA ENCUESTA
      // -----------------------------------------------------

      /**
       * Lanza las tres preguntas una detrás de otra con prompt().
       * Si el usuario cancela cualquiera, se aborta sin registrar nada.
       * Al terminar, guarda las respuestas como estado y emite un
       * CustomEvent que atraviesa el Shadow DOM.
       */
      lanzarEncuesta() {
        // Pregunta 1/3: nombre completo.
        const nombre = prompt("1/3 · ¿Cuál es tu nombre completo?");
        if (nombre === null) { this.mensaje = "Encuesta cancelada en la primera pregunta."; return; }
        if (!nombre.trim()) { this.mensaje = "El nombre completo no puede estar vacío."; return; }

        // Pregunta 2/3: comida favorita.
        const comida = prompt("2/3 · ¿Cuál es tu comida favorita?");
        if (comida === null) { this.mensaje = "Encuesta cancelada en la segunda pregunta."; return; }
        if (!comida.trim()) { this.mensaje = "La comida favorita no puede estar vacía."; return; }

        // Pregunta 3/3: mascota.
        const mascota = prompt("3/3 · ¿Cómo se llama tu mascota?");
        if (mascota === null) { this.mensaje = "Encuesta cancelada en la tercera pregunta."; return; }
        if (!mascota.trim()) { this.mensaje = "El nombre de la mascota no puede estar vacío."; return; }

        // Guardamos las respuestas como estado reactivo (dispara re-render).
        this.nombreCompleto = nombre.trim();
        this.comidaFavorita = comida.trim();
        this.mascota = mascota.trim();
        this.completada = true;
        this.mensaje = `¡Gracias, ${this.nombreCompleto}! Estas son tus respuestas:`;

        // Emitimos un evento personalizado que atraviesa el Shadow DOM.
        // composed: true → sale del Shadow DOM.
        // bubbles: true  → asciende hasta document.
        this.dispatchEvent(
          new CustomEvent("encuesta-completada", {
            detail: {
              nombreCompleto: this.nombreCompleto,
              comidaFavorita: this.comidaFavorita,
              mascota: this.mascota
            },
            bubbles: true,
            composed: true
          })
        );
      }

      /**
       * Reinicia la encuesta para poder contestarla de nuevo.
       * (Se dispara desde el botón que aparece al terminar).
       */
      reiniciar() {
        this.nombreCompleto = "Arturo";
        this.comidaFavorita = "";
        this.mascota = "";
        this.completada = false;
        this.mensaje = "Pulsa el botón para responder tres preguntas.";
      }

      // -----------------------------------------------------
      // RENDERIZADO DECLARATIVO CON LA PLANTILLA html
      // -----------------------------------------------------
      render() {
        return html`
          <article class="tarjeta">
            <span class="marca">ENCUESTA · LIT ELEMENT</span>

            <h2>Cuéntame un poco de ti</h2>
            <p class="instruccion">
              Al pulsar el botón se lanzarán tres preguntas consecutivas:
              tu nombre completo, tu comida favorita y el nombre de tu mascota.
            </p>

            <!-- Mensaje de estado (aria-live lo anuncia al cambiar). -->
            <p class="mensaje" aria-live="polite">${this.mensaje}</p>

            <!--
              Si la encuesta ya se completó, mostramos las respuestas y
              un botón para repetirla. Si no, solo el botón que la inicia.
            -->
            ${this.completada
              ? html`
                  <div class="resultados">
                    <div class="respuesta">
                      <span class="respuesta__etiqueta">Nombre completo</span>
                      <span class="respuesta__valor">${this.nombreCompleto}</span>
                    </div>
                    <div class="respuesta">
                      <span class="respuesta__etiqueta">Comida favorita</span>
                      <span class="respuesta__valor">${this.comidaFavorita}</span>
                    </div>
                    <div class="respuesta">
                      <span class="respuesta__etiqueta">Mascota</span>
                      <span class="respuesta__valor">${this.mascota}</span>
                    </div>
                  </div>

                  <button type="button" @click=${this.reiniciar}>
                    Volver a contestar
                  </button>
                `
              : html`
                  <!-- Botón único que dispara las tres preguntas. -->
                  <button type="button" @click=${this.lanzarEncuesta}>
                    Responder 3 preguntas
                  </button>
                `}
          </article>
        `;
      }
    }

    // Registramos el Web Component para poder usar <encuesta-rapida> en HTML.
    customElements.define("encuesta-rapida", EncuestaRapida);

    // -----------------------------------------------------
    // ESCUCHA DEL EVENTO PERSONALIZADO DESDE EL DOCUMENTO
    // El evento cruza el Shadow DOM gracias a composed: true.
    // -----------------------------------------------------
    document.addEventListener("encuesta-completada", (evento) => {
      const { nombreCompleto, comidaFavorita, mascota } = evento.detail;
      const salida = document.querySelector("#resultado-evento");
      salida.textContent =
        `Encuesta recibida de ${nombreCompleto} · ` +
        `comida favorita: ${comidaFavorita} · ` +
        `mascota: ${mascota}.`;
    });
  </script>
</head>

<body>
  <main class="pagina">
    <header class="encabezado">
      <p class="encabezado__sobrelinea">Web Components · LitElement</p>
      <h1>Una encuesta en un solo botón.</h1>
      <p class="encabezado__descripcion">
    Encuesta breve
      </p>
    </header>

    <!-- Uso del Web Component: contiene el botón y la lógica. -->
    <encuesta-rapida></encuesta-rapida>

    <!-- Panel externo que recibe el CustomEvent desde document. -->
    <section class="panel-evento" aria-live="polite">
      <p class="panel-evento__titulo">Comunicación con el documento</p>
      <p id="resultado-evento">
        Todavía no hay encuestas completadas. Pulsa «Responder 3 preguntas».
      </p>
    </section>

    <footer class="pie">
      Hecho con cafeína · Arturo Juárez Monroy
    </footer>
  </main>
</body>
</html>
